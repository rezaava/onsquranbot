name: Telegram Bot
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install python-telegram-bot[job-queue] beautifulsoup4 requests
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Restore state
        run: |
          git fetch origin state:state 2>/dev/null || true
          if git rev-parse --verify state >/dev/null 2>&1; then
            git checkout state -- data/ 2>/dev/null || mkdir -p data
          else
            mkdir -p data
          fi

      - name: Build database
        run: |
          if [ ! -f data/islamic.db ]; then
            echo "Building database..."
            python -m importers.quran
            python -m importers.nahj
            python -m importers.mafatih_v2
          else
            echo "Database exists, checking schema..."
            if ! python check_schema.py; then
              echo "Rebuilding database from scratch..."
              rm -f data/islamic.db
              python -m importers.quran
              python -m importers.nahj
              python -m importers.mafatih_v2
            fi
          fi

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          START=$(date +%s)
          timeout 21600 python bot.py &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            sleep 60
            ELAPSED=$(($(date +%s) - START))
            if [ $ELAPSED -gt 21300 ]; then
              echo "Preparing restart..."
              kill $PID 2>/dev/null || true
              sleep 5
            fi
          done
          wait $PID || true

      - name: Save state
        if: always()
        run: |
          mkdir -p /tmp/st
          cp -f data/stats.json data/users.pickle /tmp/st/ 2>/dev/null || true
          git config user.name "bot"
          git config user.email "bot@actions"
          git checkout --orphan state-new
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p data
          cp -f /tmp/st/* data/ 2>/dev/null || true
          git add -f data/
          git commit -m "state $(date -u +%Y%m%d_%H%M%S)" || true
          git push origin state-new:state --force

      - name: Chain restart
        if: success()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches \
            -d '{"ref":"main"}'
