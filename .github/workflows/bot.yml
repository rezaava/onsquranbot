name: bot

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Restore saved state
        run: |
          mkdir -p state
          git fetch --depth=1 origin state && git archive FETCH_HEAD | tar -x -C state || true

      - name: Run bot for about 5.4 hours
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          STATE_DIR: state
        run: |
          start=$(date +%s)
          timeout 19440 python bot.py || true
          echo "ELAPSED=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Save state
        if: always()
        run: |
          cd state
          git init -q -b state
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "state" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      - name: Restart workflow
        if: env.ELAPSED != '' && env.ELAPSED > 300
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: gh workflow run bot.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
